[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valma_bike_and_walk"
version = "0.2.0"
description = "Walking and cycling travel-time analysis from a local OpenStreetMap extract"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Sami Mäkinen" }
]

dependencies = [
    "geopandas>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "openmatrix>=0.3",
    "osmium>=4.0",
    "pyproj>=3.5",
    "scipy>=1.11",
    "shapely>=2.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
# NetworkX is only needed for RoutableNetwork.to_networkx() (plotting/interop)
# and for the test that checks our SciPy routing against a reference
# implementation; the routing core itself does not import it.
viz = [
    "matplotlib>=3.7",
    "networkx>=3.0",
]

# Reading cached elevation tiles needs a raster reader. Downloading them does
# not -- that is stdlib urllib -- so a run that only fills the cache, or one that
# takes its heights from somewhere else, needs none of this.
dem = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "networkx>=3.0",
    "openmatrix>=0.3",
    "rasterio>=1.3",
]

[project.scripts]
valma = "valma_bike_and_walk.cli:main"

[project.urls]
Homepage = "https://github.com/samakinen/valma_bike_and_walk"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# osmium, scipy and geopandas ship no type stubs.
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.black]
# Match requires-python, so black does not guess a newer grammar than the
# interpreter running it can parse.
target-version = ["py310"]